name: Basic Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -out=tfplan

      # Bundle the plan AND the .terraform folder (providers + backend config)
      - name: Upload plan + init artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-bundle
          path: |
            tfplan
            .terraform
          retention-days: 1

  terraform-apply:
    name: "Terraform Apply Check"
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # No "terraform init" here — restore what init already produced
      - name: Download plan + init artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-bundle
          path: .

      - name: Terraform apply (using saved plan)
        run: terraform apply -auto-approve tfplan

  terraform-destroy:
    name: "Terraform Destroy Check"
    runs-on: ubuntu-latest
    needs:
      - build
      - terraform-apply
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      # Reuse the same .terraform folder — still no re-init
      - name: Download init artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-bundle
          path: .

      - name: Terraform destroy
        run: terraform destroy -auto-approve